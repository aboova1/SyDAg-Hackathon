[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sydag-scout"
version = "0.1.0"
description = "Date-limited maize yield models and scouting evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "rasterio>=1.3,<2", "streamlit>=1.40,<2", "catboost>=1.2,<2", "matplotlib>=3.9,<4"]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
